name: CI
# NOTE: 'Deploy frontend' (azure-static-web-apps-ashy-coast-096246c0f.yml) is triggered by this workflow's name
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    name: API build and test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  web:
    name: Web build and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ClarityGuildWebsite.Web

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: 'npm'
        cache-dependency-path: ClarityGuildWebsite.Web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build
      env:
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        VITE_DISCORD_INVITE_URL: ${{ vars.VITE_DISCORD_INVITE_URL }}

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: ClarityGuildWebsite.Web/dist
        if-no-files-found: error
        retention-days: 7
