name: Deploy frontend
# DO NOT RENAME THIS FILE. The Static Web App's deployment authorization policy is 'GitHub':
# Azure identifies which Static Web App is deploying from the workflow filename in GitHub's
# OIDC token, and expects the original Azure-generated name. Renaming it breaks deploys with
# "Could not determine the Static Web App from the GitHub OIDC workflow reference".
# Note: Runs after the 'CI' workflow (Dev.yaml) finishes. It never builds anything itself. Deploys the web-dist artifact that CI built and tested
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Download build output from the CI run
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: dist
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get GitHub OIDC token
      id: idtoken
      uses: actions/github-script@v7
      with:
        script: return await core.getIDToken()
        result-encoding: string

    - name: Deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_COAST_096246C0F }}
        action: upload
        app_location: dist
        skip_app_build: true
        github_id_token: ${{ steps.idtoken.outputs.result }}
