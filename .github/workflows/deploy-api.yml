name: Deploy API
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID whose api-publish artifact to deploy'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-dev:
    name: Deploy Dev API
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: dev
    concurrency: { group: deploy-api-dev, cancel-in-progress: false }
    timeout-minutes: 15
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: api-publish
        path: api
        run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        package: api

  deploy-prod:
    name: Deploy Production API
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-api-prod, cancel-in-progress: false }
    timeout-minutes: 15
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: api-publish
        path: api
        run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    - uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        package: api
